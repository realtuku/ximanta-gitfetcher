name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Grant execute permission for gradlew (if it exists)
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Upload Debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ximanta-gitfetcher-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ximanta-gitfetcher-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Rename APKs for release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/debug/*.apk release-apks/ximanta-gitfetcher-debug.apk
          cp app/build/outputs/apk/release/*.apk release-apks/ximanta-gitfetcher-release-unsigned.apk

      - name: Upload APKs to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-apks/ximanta-gitfetcher-debug.apk
            release-apks/ximanta-gitfetcher-release-unsigned.apk
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
