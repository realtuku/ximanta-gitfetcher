# -----------------------------------------------------------------------------
# Project-wide Gradle settings — Ximanta GitFetcher
# -----------------------------------------------------------------------------

# JVM arguments used by the Gradle daemon.
# 2 GB heap is plenty for a small Compose app; bump to 4 GB if you add Hilt/KSP.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable the Gradle build cache for faster incremental builds.
org.gradle.caching=true

# Run modules in parallel where possible.
org.gradle.parallel=true

# Enable AndroidX (required for Jetpack Compose & all modern support libs).
android.useAndroidX=true

# Non-transitive R classes — faster builds, smaller APK, fewer accidental
# references to resources you didn't declare.
android.nonTransitiveRClass=true

# Kotlin code style for the whole project.
kotlin.code.style=official

# Suppress the Kotlin DSL's nagging about assignment deprecation.
kotlin.daemon.jvmargs=-Xmx1536m
